services:
  mysql:
    image: mysql:latest
    container_name: mindcash-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mindcash-root
      MYSQL_DATABASE: mindcash-mysql
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: